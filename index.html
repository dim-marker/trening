<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markerlərin Treninq Qeydiyyatı</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --focus-ring: rgba(37, 99, 235, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px 16px;
        }

        .container {
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
            border: 1px solid var(--border-color);
            padding: 36px 32px;
        }

        .form-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .form-header h2 {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
        }

        .form-header p {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 14px;
            color: var(--text-main);
            background-color: #fff;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px var(--focus-ring);
        }

        input:disabled, select:disabled {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
            border-color: #e2e8f0;
        }

        input[readonly] {
            background-color: #f1f5f9;
            color: #475569;
            cursor: not-allowed;
            border-color: #cbd5e0;
        }

        .fin-input-box {
            display: flex;
            gap: 8px;
        }

        .fin-input-box input {
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 1px;
            flex: 1;
        }

        .btn-search {
            padding: 12px 18px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
            transition: 0.2s;
        }

        .btn-search:hover {
            background-color: #0369a1;
        }

        .info-text {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Əvvəlki Qeydiyyat Bildiriş Paneli */
        .previous-reg-banner {
            display: none;
            background-color: #f0fdf4;
            border: 1px solid #bbf7d0;
            border-radius: 10px;
            padding: 14px 16px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #166534;
            line-height: 1.5;
        }
        .previous-reg-banner strong {
            color: #15803d;
        }
        .previous-reg-banner ul {
            margin-top: 6px;
            padding-left: 18px;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.99);
        }

        .btn-submit:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            background-color: #94a3b8;
        }

        #statusMessage {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        #statusMessage.loading {
            display: flex;
            background-color: #e0f2fe;
            color: #0369a1;
            border: 1px solid #bae6fd;
        }

        #statusMessage.success {
            display: flex;
            background-color: #f0fdf4;
            color: #15803d;
            border: 1px solid #bbf7d0;
        }

        #statusMessage.error {
            display: flex;
            background-color: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .spinner {
            width: 16px;
            height: 16px;
            border: 2px solid #0284c7;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="form-header">
        <h2>Qeydiyyat</h2>
        <p>Məlumatlarınızı təsdiqləyin və ya yeniləyin</p>
    </div>

    <!-- Əvvəlki Qeydiyyat Tarixi və Vaxtı Bildiriş Paneli -->
    <div id="prevRegBanner" class="previous-reg-banner">
        <div><strong>ℹ️ Əvvəlki Qeydiyyat Məlumatınız:</strong></div>
        <ul>
            <li><strong>Seçilmiş Vaxt:</strong> <span id="bannerPrevTime">-</span></li>
            <li><strong>Təsdiq Tarixi:</strong> <span id="bannerPrevDate">-</span></li>
        </ul>
    </div>

    <form id="registrationForm">
        <div class="form-group">
            <label for="fin">FİN Kodunuz:</label>
            <div class="fin-input-box">
                <input type="text" id="fin" name="fin" maxlength="10" required placeholder="FİN daxil edin" autocomplete="off">
                <button type="button" class="btn-search" onclick="checkFinInDatabase()">🔍 Axtar</button>
            </div>
            <div class="info-text">FİN kodu yazdıqdan sonra "Axtar" düyməsini sıxın.</div>
        </div>

        <div class="form-group grid-2">
            <div>
                <label for="soyad">Soyad:</label>
                <input type="text" id="soyad" name="soyad" required placeholder=" " disabled>
            </div>
            <div>
                <label for="ad">Ad:</label>
                <input type="text" id="ad" name="ad" required placeholder=" " disabled>
            </div>
        </div>

        <div class="form-group grid-2">
            <div>
                <label for="ata_adi">Ata Adı:</label>
                <input type="text" id="ata_adi" name="ata_adi" required placeholder=" " disabled>
            </div>
            <div>
                <label for="phone">Mobil Telefon:</label>
                <input type="tel" id="phone" name="phone" required placeholder=" " disabled>
            </div>
        </div>

        <div class="form-group">
            <label for="fen">Tədris Etdiyiniz Fənn:</label>
            <select id="fen" name="fen" required disabled onchange="handleFennChange()">
                <option value="">-- Fənn seçin --</option>
                <option value="Riyaziyyat">Riyaziyyat</option>
                <option value="Azərbaycan dili">Azərbaycan dili</option>
                <option value="İngilis dili">İngilis dili</option>
                <option value="Rus dili">Rus dili</option>
                <option value="Coğrafiya">Coğrafiya</option>
                <option value="Kimya">Kimya</option>
                <option value="Biologiya">Biologiya</option>
                <option value="Fizika">Fizika</option>
                <option value="Tarix">Tarix</option>
                <option value="İnformatika">İnformatika</option>
            </select>
        </div>

        <div class="form-group">
            <label for="region">Region Bölməsi:</label>
            <select id="region" name="region" required disabled onchange="handleRegionChange()">
                <option value="">-- Region seçin --</option>
                <option value="BAKI">BAKI</option>
                <option value="GƏNCƏ">GƏNCƏ</option>
                <option value="NAXÇIVAN">NAXÇIVAN</option>
                <option value="ŞƏKİ">ŞƏKİ</option>
                <option value="BƏRDƏ">BƏRDƏ</option>
                <option value="ŞİRVAN">ŞİRVAN</option>
                <option value="GÖYÇAY">GÖYÇAY</option>
                <option value="LƏNKƏRAN">LƏNKƏRAN</option>
                <option value="ŞƏMKİR">ŞƏMKİR</option>
                <option value="XAÇMAZ">XAÇMAZ</option>
            </select>
        </div>

        <div class="form-group">
            <label for="vaxt">Treninqdə İştirak Vaxtı:</label>
            <select id="vaxt" name="vaxt" disabled>
                <option value="">-- Əvvəlcə fənn və region seçin --</option>
            </select>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit" disabled>Məlumatları Təsdiqlə</button>
    </form>

    <div id="statusMessage"></div>
</div>

<script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzpcgieqXWBkkyLMWoWvJyIiI7ahsesdbco8G70aQwN8Id8Itk890navp-0-MIBvNOITg/exec";

    let dynamicTimes = [];
    let isFinVerified = false;

    window.addEventListener('load', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const finParam = urlParams.get('fin');

        if (finParam) {
            const finInput = document.getElementById('fin');
            if (finInput) {
                finInput.value = finParam;
                checkFinInDatabase();
            }
        }
    });

    fetch(`${SCRIPT_URL}?action=getTimes`)
        .then(res => res.json())
        .then(res => {
            if (res.success) dynamicTimes = res.times;
        });

    function updateVaxtOptions(savedVaxt = "") {
        const region = document.getElementById('region').value;
        const fenn = document.getElementById('fen').value;
        const vaxtSelect = document.getElementById('vaxt');

        vaxtSelect.innerHTML = '<option value="">-- Vaxt seçin --</option>';

        if (region === 'BAKI' && fenn) {
            vaxtSelect.disabled = false;
            vaxtSelect.required = true;

            const availableTimes = dynamicTimes.filter(t => t.fen === fenn);
            let foundSaved = false;

            if (availableTimes.length > 0) {
                availableTimes.forEach(item => {
                    const opt = document.createElement('option');
                    opt.value = item.vaxt;
                    opt.innerText = item.vaxt;
                    if (item.vaxt === savedVaxt) {
                        opt.selected = true;
                        foundSaved = true;
                    }
                    vaxtSelect.appendChild(opt);
                });
            }

            // MƏSƏLƏNİN HƏLLİ: Əgər istifadəçinin əvvəl seçdiyi vaxt silinibsə, onu yenə də siyahıya xüsusi qeydlə əlavə edirik!
            if (savedVaxt && !foundSaved && savedVaxt !== "-") {
                const opt = document.createElement('option');
                opt.value = savedVaxt;
                opt.innerText = `${savedVaxt} (Əvvəlki seçiminiz)`;
                opt.selected = true;
                vaxtSelect.appendChild(opt);
            }

            if (vaxtSelect.options.length <= 1) {
                vaxtSelect.innerHTML = '<option value="">Bu fənn üçün aktiv vaxt tapılmadı</option>';
            }
        } else {
            vaxtSelect.disabled = true;
            vaxtSelect.required = false;
        }
    }

    function handleRegionChange() { updateVaxtOptions(); }
    function handleFennChange() { updateVaxtOptions(); }

    function showStatus(msg, type, showSpinner = false) {
        const status = document.getElementById('statusMessage');
        status.className = type;
        if (showSpinner) {
            status.innerHTML = `<span class="spinner"></span> <span>${msg}</span>`;
        } else {
            status.innerText = msg;
        }
    }

    function toggleFormFields(enable) {
        const inputs = document.querySelectorAll('#registrationForm input, #registrationForm select, #submitBtn');
        inputs.forEach(el => {
            if (el.id !== 'fin') { 
                el.disabled = !enable;
            }
        });
    }

    function resetEntireForm() {
        document.getElementById('registrationForm').reset();
        const finInput = document.getElementById('fin');
        finInput.readOnly = false;
        isFinVerified = false;
        toggleFormFields(false);
        document.getElementById('prevRegBanner').style.display = 'none';
        updateVaxtOptions();
        document.getElementById('submitBtn').innerText = "Məlumatları Təsdiqlə";
    }

    function checkFinInDatabase() {
        const finInput = document.getElementById('fin');
        const finVal = finInput.value.trim().toUpperCase();
        finInput.value = finVal;

        if (!finVal) {
            showStatus("Xahiş olunur FİN kod daxil edin!", "error");
            return;
        }

        showStatus("MƏLUMATINIZ AXTARILIR...", "loading", true);

        fetch(`${SCRIPT_URL}?fin=${encodeURIComponent(finVal)}`)
        .then(res => res.json())
        .then(data => {
            if (data.exists) {
                isFinVerified = true;
                finInput.readOnly = true; 
                toggleFormFields(true);  

                document.getElementById('soyad').value = data.soyad || '';
                document.getElementById('ad').value = data.ad || '';
                document.getElementById('ata_adi').value = data.ata_adi || '';
                document.getElementById('phone').value = data.phone || '';
                document.getElementById('fen').value = data.fen || '';
                document.getElementById('region').value = data.region || '';

                updateVaxtOptions(data.vaxt || '');

                // BİLDİRİŞ BANNERİ: Əgər əvvəllər vaxt və ya status varsa ekranda xüsusi panel çıxır
                // BİLDİRİŞ BANNERİ DƏYİŞİKLİYİ
                const banner = document.getElementById('prevRegBanner');
                const prevTimeSpan = document.getElementById('bannerPrevTime');
                const prevDateSpan = document.getElementById('bannerPrevDate');

                // Sütun adları müxtəlif ola biləcəyi üçün hamısını yoxlayırıq
                const savedVaxt = data.vaxt || data.qeyd_vaxti || "Seçilməyib";
                const savedStatus = data.status || data.qeyd_tarixi || data.tarix || "Təsdiqlənib";

                if (savedVaxt !== "Seçilməyib" || savedStatus !== "Təsdiqlənməyib") {
                    prevTimeSpan.innerText = savedVaxt;
                    // Əgər dəyər True/False və ya tarixdirsə, aydın mətnlə göstəririk
                    prevDateSpan.innerText = (savedStatus === true || savedStatus === "true") ? "Təsdiqlənib" : savedStatus;
                    banner.style.display = 'block';
                } else {
                    banner.style.display = 'none';
                }

                document.getElementById('submitBtn').innerText = "Məlumatları Yenilə və Təsdiqlə";
                showStatus("Məlumatlarınız tapıldı. Yoxlayıb təsdiqləyə bilərsiniz.", "success");
            } else {
                resetEntireForm();
                finInput.value = finVal;
                showStatus("Sizin FİN kodunuz ekspertlər siyahısında tapılmadı!", "error");
            }
        })
        .catch(err => {
            console.error(err);
            showStatus("Yoxlanış zamanı xəta baş verdi.", "error");
        });
    }

    document.getElementById('fin').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            checkFinInDatabase();
        }
    });

    document.getElementById('registrationForm').addEventListener('submit', function(e) {
        e.preventDefault();

        if (!isFinVerified) {
            showStatus("Xəta: Daxil edilən FİN kod bazada tapılmayıb!", "error");
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerText = "Yazılır...";
        showStatus("Məlumatlar cədvələ işlənir...", "loading", true);

        const formData = new FormData(this);

        fetch(SCRIPT_URL, { method: 'POST', body: formData })
        .then(res => res.text())
        .then(response => {
            showStatus("Məlumatlarınız uğurla təsdiqləndi və bazada yeniləndi!", "success");
            resetEntireForm();
        })
        .catch(error => {
            showStatus("Xəta baş verdi. Yenidən cəhd edin.", "error");
            console.error('Xəta:', error);
        })
        .finally(() => {
            btn.disabled = false;
        });
    });
</script>

</body>
</html>
